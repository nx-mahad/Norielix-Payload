name: Generate Payload Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: pnpm payload migrate:create initial

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/migrations
          git diff --staged --quiet && echo "No migration changes to commit" || git commit -m "Add generated Payload migration"
          git push
